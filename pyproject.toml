[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentvideommd"
version = "0.1.0"
description = "Direct Qwen3-VL inference baseline for video fake-news detection"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers>=4.57.3",
  "accelerate>=0.26",
  "qwen-vl-utils>=0.0.14",
  "PyYAML>=6.0",
  "decord>=0.6.0",
  "numpy>=1.24",
  "Pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
