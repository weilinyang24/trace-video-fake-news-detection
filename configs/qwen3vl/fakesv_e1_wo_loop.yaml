model:
  path: /data2/573ops_ser/models/Qwen3-VL-30B-Instruct
  backend: qwen3_vl
  dtype: bfloat16
  attn_implementation: flash_attention_2
  device_map: auto
  trust_remote_code: true
text_model:
  path: /data2/573ops_ser/models/Qwen3-8B
  backend: qwen3
  dtype: bfloat16
  attn_implementation: flash_attention_2
  device_map: auto
  trust_remote_code: true
audio_model:
  path: /data2/573ops_ser/models/Qwen2-Audio-7B-Instruct
  backend: qwen2_audio
  dtype: bfloat16
  attn_implementation: flash_attention_2
  device_map: auto
  trust_remote_code: true
dataset:
  name: fakesv
  manifest: data/manifests/fakesv_test.jsonl
  video_root: /data2/573ops_ser/data/FakeSV/video/videos
video:
  fps: 2
  decoder_backend: decord
  fallback_num_frames: 16
  min_visual_tokens: 256
  max_visual_tokens: 16384
  spatial_compression: 32
  temporal_compression: 2
generation:
  max_new_tokens: 1
  do_sample: false
  use_cache: true
  seed: 2025
output:
  predictions: outputs/qwen3_vl_30b_fewshot/fakesv_test_predictions.jsonl
  metrics: outputs/qwen3_vl_30b_fewshot/fakesv_test_metrics.json
runtime:
  max_consecutive_errors: 3
two_stage:
  ablation:
    use_audio: true
    use_rag: true
    use_loop: false
  retrieval_per_label: 2
  max_video_frames: 64
  visual_max_new_tokens: 768
  judge_max_new_tokens: 384
  visual_cache:
    enabled: true
    path: outputs/cache/stage1_visual.sqlite3
    schema_version: 1
    refresh: false
  audio_cache:
    enabled: true
    path: outputs/cache/audio_evidence.sqlite3
    schema_version: 1
    refresh: false
    live_on_miss: false
    sample_rate: 16000
    max_new_tokens: 512
  judge_loop:
    enabled: true
    review_max_new_tokens: 256
    final_max_new_tokens: 384
  predictions: outputs/ablations/fakesv_e1_wo_loop_predictions.jsonl
  metrics: outputs/ablations/fakesv_e1_wo_loop_metrics.json
