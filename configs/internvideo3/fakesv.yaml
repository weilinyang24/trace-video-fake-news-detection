model:
  path: /data2/573ops_ser/models/InternVL-8B
  backend: hf_video
  dtype: bfloat16
  attn_implementation: flash_attention_2
  device_map: auto
  trust_remote_code: true
dataset:
  name: fakesv
  manifest: data/manifests/fakesv_test.jsonl
  video_root: /data2/573ops_ser/data/FakeSV/video
video:
  fps: 4
  min_pixels: 262144
  max_pixels: 524288
generation:
  max_new_tokens: 8
  do_sample: false
  seed: 2025
output:
  predictions: outputs/internvideo3/fakesv_test_predictions.jsonl
  metrics: outputs/internvideo3/fakesv_test_metrics.json
runtime:
  max_consecutive_errors: 3
